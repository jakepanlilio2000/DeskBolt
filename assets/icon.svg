<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="DeskBolt Icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded slate badge -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle architectural glow behind monitor -->
  <circle cx="128" cy="116" r="64" fill="#0EA5E9" fill-opacity="0.10"/>

  <!-- Monitor bezel -->
  <rect x="44" y="54" width="168" height="114" rx="14" fill="url(#screen)" stroke="url(#frame)" stroke-width="7"/>

  <!-- Monitor stand neck and base -->
  <path d="M116 171 L140 171 L144 192 L112 192 Z" fill="#64748B"/>
  <rect x="86" y="191" width="84" height="10" rx="5" fill="#94A3B8"/>

  <!-- Precision lightning bolt emblem -->
  <path d="M138 72 L103 117 L126 117 L116 152 L154 106 L131 106 Z" fill="url(#bolt)" stroke="#E0F2FE" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
